<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout record — Sojib Pay</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">Sojib<span>Pay</span></a><nav><a href="/developers.html">API Docs</a></nav></header><main class="wrap"><section class="panel"><p class="eyebrow">PAYMENT REQUEST</p><h1 id="title">Loading request…</h1><div id="details" class="notice">Looking up request</div><p class="muted small">This page displays a request record only. Do not send money until an approved provider checkout flow is connected and payment instructions are verified.</p></section></main><script>const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('details');if(!id){box.textContent='Missing request ID.'}else fetch('/api/checkout/'+encodeURIComponent(id)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Not found');document.getElementById('title').textContent=d.payment.business_name;box.innerHTML='<p>Reference: <b>'+d.payment.public_id+'</b></p><p>Amount: <b>৳'+Number(d.payment.amount).toFixed(2)+'</b></p><p>Description: '+String(d.payment.description||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><p>Status: '+d.payment.status+'</p>'}).catch(e=>box.textContent=e.message)</script></body></html>
